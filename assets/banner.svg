<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 16s ease-in-out infinite alternate;
      }
      .streamer-1 {
        stroke-dasharray: 120 400;
        animation: dashStream 6s linear infinite;
      }
      .streamer-2 {
        stroke-dasharray: 80 320;
        animation: dashStreamRev 8s linear infinite;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        100% { transform: translate(60px, 40px) scale(1.15); opacity: 0.6; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.3; }
        100% { transform: translate(-50px, -30px) scale(0.9); opacity: 0.55; }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 520; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dashStreamRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes pulsePill {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.7)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g opacity="0.45">
    <circle class="glow-orb-1" cx="220" cy="110" r="160" fill="#38bdf8" filter="url(#glow)" />
    <circle class="glow-orb-2" cx="980" cy="300" r="180" fill="#a855f7" filter="url(#glow)" />
    <circle class="glow-orb-1" cx="600" cy="380" r="120" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Dynamic Roadmap Flow Lines (Underneath Content) -->
  <g fill="none" opacity="0.6">
    <!-- Curved Track 1 -->
    <path d="M -50 340 C 250 340, 350 290, 600 310 C 850 330, 950 250, 1250 250" stroke="#1e293b" stroke-width="4" />
    <path class="streamer-1" d="M -50 340 C 250 340, 350 290, 600 310 C 850 330, 950 250, 1250 250" stroke="#38bdf8" stroke-width="3" />

    <!-- Curved Track 2 -->
    <path d="M -50 90 C 220 90, 400 150, 650 120 C 900 90, 1050 180, 1250 180" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 6" />
    <path class="streamer-2" d="M -50 90 C 220 90, 400 150, 650 120 C 900 90, 1050 180, 1250 180" stroke="#a855f7" stroke-width="2.5" />
  </g>

  <!-- Subtle Strategic Roadmap Milestone Nodes in Background -->
  <g opacity="0.55">
    <g transform="translate(140, 315)">
      <rect x="-45" y="-14" width="90" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Q1 • Strategy</text>
    </g>
    <g transform="translate(600, 285)">
      <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Q2 • Allocation</text>
    </g>
    <g transform="translate(1040, 225)">
      <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Q3 • Governance</text>
    </g>
  </g>

  <!-- FOREGROUND: Category Pill -->
  <g class="pulse-pill" transform="translate(600, 65)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="url(#primaryTextGrad)" stroke-width="1.5" />
    <circle cx="-165" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="2" text-anchor="middle">PORTFOLIO PLANNING &amp; ROADMAPPING</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <g transform="translate(600, 145)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#primaryTextGrad)" text-anchor="middle" letter-spacing="-1">
      Awesome Advanced Roadmapping
    </text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">
      &amp; Strategic Portfolio Governance
    </text>
  </g>

  <!-- FOREGROUND: Tagline / Description -->
  <g transform="translate(600, 235)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Curated guide to enterprise PPM suites, product roadmaps, capacity forecasting &amp; self-hosted open-source stacks
    </text>
  </g>

  <!-- FOREGROUND: Feature Chips -->
  <g transform="translate(600, 360)">
    <!-- Chip 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">🎯 Strategy Alignment</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">📊 Capacity Planning</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(120, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">🛡️ Portfolio Governance</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">🚀 Open-Source PM</text>
    </g>
  </g>
</svg>
